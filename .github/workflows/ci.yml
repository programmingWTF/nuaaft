name: Skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install websockets pycryptodome
      - run: python -m unittest discover -s tests -v
      - run: python scripts/nuaa_aes.py self-test
      - run: python scripts/qr_login.py --help
      - run: python scripts/nuaa_api.py --help
      - run: python scripts/study_material.py --help
